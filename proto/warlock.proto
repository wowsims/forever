// END GENERATED
message WarlockOptions {
	enum Summon {
		NoSummon = 0;
		Imp = 1;
		Voidwalker = 2;
		Succubus = 3;
		Felhunter = 4;
	}

	enum Armor {
		NoArmor = 0;
		DemonArmor = 2;
	}

	// Agony and Doom are Banes in Forever, cast directly rather than as the assigned curse. NoCurse
	// assigns none, and leaves every raid curse on.
	enum CurseOptions {
		Elements = 0;
		Recklessness = 3;
		NoCurse = 4;
		Weakness = 5;
	}

	// The demon out. With a sacrifice and no Demonic Pact, none is: summoning any demon cancels the effect.
	Summon summon = 1;
	Armor armor = 4;
	CurseOptions curse_options = 7;
	// The demon Demonic Sacrifice sacrifices, NoSummon for none.
	Summon sacrificed_demon = 8;
	// The Soul Shards carried into the fight.
	int32 soul_shards = 9;
}

// The build whose rotation the simple rotation runs. None runs Demo (Fire Brand), the rotation Auto runs.
enum WarlockRotation {
	WarlockRotationNone = 0;
	WarlockRotationDemoFireBrand = 1;
	WarlockRotationDemoShadowBrand = 2;
	WarlockRotationDestro = 3;
	WarlockRotationSmRuin = 4;
	WarlockRotationAffWrack = 5;
}

message Warlock {
	// The build rotations cast the ranks books teach; each use_ field left false casts the trainer's top rank in its place.
	message Rotation {
		WarlockRotation rotation = 1;
		bool use_shadow_bolt_rank_10 = 2;
		bool use_immolate_rank_8 = 3;
		bool use_corruption_rank_7 = 4;
	}

	message Options {
		WarlockOptions class_options = 1;
	}
	Options options = 1;
}
