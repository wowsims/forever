message DruidOptions {
	UnitReference innervate_target = 1;
}

message BalanceDruid {
  message Rotation {}

  message Options {
    DruidOptions class_options = 1;
  }
  Options options = 3;
}

message FeralCatDruid {
  // The cat plays APL rotations only.
  message Rotation {}

  message Options {
    DruidOptions class_options = 1;
    bool cannot_shred_target = 2;
    // Rend and Tear and the Bleed Is Active APL value treat the target as bleeding whatever bleeds it has.
    bool assume_bleed_active = 3;
    // Clearcasting is up at the pull, fished for out of combat with spells before it.
    bool prepull_clearcasting = 4;
  }
  Options options = 3;
}

message FeralBearDruid {
  // The bear plays APL rotations only.
  message Rotation {}

  message Options {
    DruidOptions class_options = 1;
    double starting_rage = 2;
    // Rend and Tear and the Bleed Is Active APL value treat the target as bleeding whatever bleeds it has.
    bool assume_bleed_active = 3;
  }
  Options options = 3;
}

message RestorationDruid {
  message Rotation {}

  message Options {
    DruidOptions class_options = 1;
  }
  Options options = 3;
}
