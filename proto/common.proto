	string name = 2;
	repeated double stats = 3;
	repeated double pseudo_stats = 4; // Indexed by PseudoStat; flat, not scaled by the item's random property points.
	bool reduced_caster_dps = 5; // A weapon with the suffix deals the reduced_caster_weapon_damage of its scaling options.
}

message ItemSpec {
