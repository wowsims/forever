syntax = "proto3";
package proto;

option go_package = "./proto";

import "google/protobuf/descriptor.proto";

// protobuf does not directly support constants for versioning purposes, but we
// can emulate the functionality of a CURRENT_VERSION_NUMBER constant by
// defining it as a custom option for a ProtoVersion message whose only purpose
// is to house the value of this option. While a bit hacky, this allows us to
// increment the version number directly in the proto files, rather than needing
// to separately increment two constants in the front-end and back-end code.
extend google.protobuf.MessageOptions {
	int32 current_version_number = 50000;
}

// The spell a talent field stands for, which every rank of the talent shares. An APL condition
// names a talent by this id, so it outlives a rename of the field.
extend google.protobuf.FieldOptions {
	int32 talent_spell_id = 50001;
}

message ProtoVersion {
	// The version the UI stamps every api_version field with. The sim is not
	// deployed anywhere, so no saved browser data or sim link predates this
	// number and nothing converts one: a breaking proto change simply breaks
	// whatever a browser still holds.
	option (current_version_number) = 2;

	// The actual field value is only used within unit tests.
	int32 saved_version_number = 1;
}

message ScalingItemProperties {
    int32 rand_prop_points = 1;
    double weapon_damage_min = 2;
    double weapon_damage_max = 3;
    float unrounded_dps = 8;
    map<int32, double> stats = 4; // for compactness
	int32 ilvl = 6;
	// The damage the weapon deals with a random suffix that reduces caster DPS; unset on items with no such suffix option.
	ReducedCasterWeaponDamage reduced_caster_weapon_damage = 9;

	// Stats that only apply while the encounter is in that kind of area.
	repeated AreaStats area_stats = 7;
}

message ReducedCasterWeaponDamage {
	double weapon_damage_min = 1;
	double weapon_damage_max = 2;
	float unrounded_dps = 3;
}

message AreaStats {
	AreaType area_type = 1;
	map<int32, double> stats = 2; // keys are the numeric values of Stat
}

// Stats that only apply against a target of one of these mob types.
message MobTypeStats {
	repeated MobType mob_types = 1;
	map<int32, double> stats = 2; // keys are the numeric values of Stat
}

// Stats that only apply while the encounter is in one of these zones, by AreaTable id.
message ZoneStats {
	repeated int32 zone_ids = 1;
	map<int32, double> stats = 2; // keys are the numeric values of Stat
}

