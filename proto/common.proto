	// Contains all available conjured items
	repeated int32 conjured_items = 18;
	// Item ids of the consumables the character uses besides the one-per-kind fields above.
	repeated int32 extra_ids = 19;
	// Item ids of the elixirs the character uses, any number of them.
	repeated int32 elixir_ids = 21;
	// The poison, firestone, spellstone or Scroll of Imbue on each hand, beside its stone or oil above.
	int32 mh_weapon_imbue_id = 22;
	int32 oh_weapon_imbue_id = 23;
	// The same four picks for the item swap set's weapons.
	int32 swap_mh_imbue_id = 24;
	int32 swap_oh_imbue_id = 25;
	int32 swap_mh_weapon_imbue_id = 26;
	int32 swap_oh_weapon_imbue_id = 27;
	// The potion each APL potion placeholder casts, one per PotionClass.
	int32 resource_pot_id = 28;
	int32 defensive_pot_id = 29;
	int32 offensive_pot_id = 30;
}

