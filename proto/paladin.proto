message PaladinOptions {
}

// The auras a paladin turns on before the pull.
enum PaladinAura {
	AuraUnknown          = 0; // Not a choice: the simple rotation keeps the aura its APL casts.
	RetributionAura      = 1;
	DevotionAura         = 2;
	ConcentrationAura    = 3;
	FireResistanceAura   = 4;
	FrostResistanceAura  = 5;
	ShadowResistanceAura = 6;
}

// The Judgement a raid assigns a paladin to keep on the target.
enum PaladinJudgement {
	JudgementNone          = 0;
	JudgementOfTheCrusader = 1;
	JudgementOfLight       = 2;
	JudgementOfWisdom      = 3;
}

// The seals the player keeps up during the fight if not talented into Twist of Light.
enum PaladinSeal {
	SealUnknown         = 0; // Not a choice: the simple rotation defaults to either Seal of Command or Seal of Righteousness
	SealOfCommand       = 1;
	SealOfRighteousness = 2;
}

message RetributionPaladin {
	message Rotation {
		PaladinAura aura                    = 1;
		PaladinJudgement assigned_judgement = 2; // Cast before the pull and judged on the way in; JudgementNone skips it.
		PaladinSeal non_twist_seal          = 3; // When Twist of Light is not talented, this is the seal being kept up.
		int32 pull_range                    = 4; // Where the paladin stands at the pull, in yards. 0 is 25 yd, and below 11 is 11.
		int32 delay_major_cds               = 5; // Seconds into the fight before the other cooldowns are cast.
	}

	message Options {
		PaladinOptions class_options = 1;
	}
	Options options = 1;
}

message ProtectionPaladin {
	message Rotation {}

	message Options {
		PaladinOptions class_options = 1;
	}
	Options options = 1;
}

message HolyPaladin {
	message Rotation {}

	message Options {
		PaladinOptions class_options = 1;
	}
	Options options = 1;
}
