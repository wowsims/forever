name: Release

on:
    workflow_dispatch:
        # Inputs the workflow accepts.
        inputs:
            ref:
                description: 'Commit Reference'
                default: 'master'
                required: true
            tag:
                description: 'Version Tag'
                default: 'v0.0.0'
                required: true

jobs:
    tests:
        uses: ./.github/workflows/run_tests.yml
        permissions:
            contents: read
            pull-requests: write
        with:
            ref: ${{ github.event.inputs.ref }}

    build-and-release:
        needs: tests
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.ref }}
                  # The full history, so the build can name each spec's last change (tools/vite/build_info.mts).
                  # git log over paths reads commits and trees only, so the file contents stay out of it.
                  fetch-depth: 0
                  filter: blob:none

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.27.x

            - name: Install Protoc
              uses: ./.github/actions/setup-protoc

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 26
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build 🔧
              run: |
                  make clean && VERSION=${{ github.event.inputs.tag }} make release

            - name: Release
              uses: ncipollo/release-action@v1
              with:
                  commit: ${{ github.event.inputs.ref }}
                  tag: ${{ github.event.inputs.tag }}
                  generateReleaseNotes: true
                  makeLatest: true
                  artifactErrorsFailBuild: true
                  artifacts: |
                      wowsimcli-amd64-linux.zip
                      wowsimcli-windows.exe.zip
                      wowsimcli-arm64-darwin.zip
                      wowsimforever-amd64-darwin.zip
                      wowsimforever-arm64-darwin.zip
                      wowsimforever-amd64-linux.zip
                      wowsimforever-windows.exe.zip
