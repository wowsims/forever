name: Release

on:
    workflow_dispatch:
        # Inputs the workflow accepts.
        inputs:
            ref:
                description: 'Commit Reference'
                default: 'master'
                required: true
            tag:
                description: 'Version Tag'
                default: 'v0.0.0'
                required: true
            # A draft is visible only to people with push access, gets its tag when someone publishes it, and is
            # never installed by the self-updater. Scheduled Release reads only tags, so its next run still releases
            # master: disable it while a draft is checked. Publish or delete a draft before another run uses its tag.
            draft:
                description: 'Draft release'
                type: boolean
                default: false

# Every job names the permissions it needs; the self-updater installs whatever a release holds.
permissions: {}

# One release at a time, so two runs never race for the same tag or the latest release.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # The jobs after this one need it, so its guard skips them too.
    check-tag:
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            sha: ${{ steps.commit.outputs.sha }}
        steps:
            - name: Check the tag
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::The tag must look like v1.2.3."
                    exit 1
                  fi

            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: 0
                  filter: blob:none
                  persist-credentials: false

            # The commit the tests run on is the one released, and it is on master.
            - name: Check the commit
              id: commit
              run: |
                  if ! git merge-base --is-ancestor HEAD origin/master; then
                    echo "::error::The commit is not on master."
                    exit 1
                  fi
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    tests:
        needs: check-tag
        uses: ./.github/workflows/run_tests.yml
        permissions:
            contents: read
            pull-requests: write
        with:
            ref: ${{ needs.check-tag.outputs.sha }}
            # The released commit can be behind master's tip, and against the tip TestProtoVersioning would read
            # master's newer fields as deletions. Against the commit itself it finds no change, which leaves the check
            # to the pull request and the deploy run that already passed it.
            proto_baseline: ${{ needs.check-tag.outputs.sha }}
            # The site the web server embeds, built by the tests' build-ui job. binary_dist drops lib.wasm, so the
            # build skips wasm-opt.
            site-artifact: true

    # The release is published with the release App's token, which only the release environment (master) holds and
    # which the v* tag ruleset lets through; the job's own token only reads.
    build-and-release:
        needs: [check-tag, tests]
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  ref: ${{ needs.check-tag.outputs.sha }}
                  # The full history, so the build can name each spec's last change (tools/vite/build_info.mts).
                  # git log over paths reads commits and trees only, so the file contents stay out of it.
                  fetch-depth: 0
                  filter: blob:none
                  persist-credentials: false

            # goreleaser reads the version from a tag on the checked-out commit. The tag is made here only; GitHub
            # creates it when goreleaser publishes the release (target_commitish in .goreleaser.yaml). An existing tag
            # would keep pointing at its own commit, so the run stops on one.
            - name: Tag the commit
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
                    echo "::error::$TAG already exists."
                    exit 1
                  fi
                  git tag "$TAG"

            - name: Install Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version: 1.27.x

            - name: Install Protoc
              uses: ./.github/actions/setup-protoc

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12

            - name: Download the site
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: site
                  path: dist/forever

            # -o keeps make from rebuilding the downloaded site. GoReleaser builds against the generated protos, which
            # the site build would otherwise have made. The check stops a release that would embed the empty stub.
            - name: Copy the site into binary_dist 🔧
              run: |
                  make -o dist/forever/.dirstamp sim/core/proto/api.pb.go binary_dist binary_dist/dist.go
                  test -f binary_dist/forever/index.html

            # Made after the build steps, so the token exists only for the release itself.
            - name: Get the release token
              id: release-token
              uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            # GitHub's generated notes list each pull request merged since the previous tag with its author. GoReleaser's
            # github-native changelog asks for them without the commit, and GitHub reads a tag it does not have yet at
            # the default branch's tip, so this step asks with the commit. The call needs contents write.
            - name: Write the release notes
              env:
                  GH_TOKEN: ${{ steps.release-token.outputs.token }}
                  TAG: ${{ inputs.tag }}
                  SHA: ${{ needs.check-tag.outputs.sha }}
              run: |
                  previous=$(git tag --list 'v*' --sort=-v:refname --merged HEAD | awk -v tag="$TAG" '$0 != tag { print; exit }')
                  args=(-f tag_name="$TAG" -f target_commitish="$SHA")
                  if [ -n "$previous" ]; then
                    args+=(-f previous_tag_name="$previous")
                  fi
                  gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/release-notes.md"

            - name: Release
              uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
              with:
                  version: v2.20.3
                  args: release --clean --release-notes ${{ runner.temp }}/release-notes.md${{ inputs.draft && ' --draft' || '' }}
              env:
                  GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
                  GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
