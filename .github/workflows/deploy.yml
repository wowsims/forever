name: Build and Deploy
on:
    push:
        branches:
            - master
    # Update Items dispatches this after it merges; a merge by the workflow token starts no push run.
    workflow_dispatch:
        inputs:
            proto_baseline:
                description: 'The master tip before the merge'
                required: true
                type: string
jobs:
    tests:
        uses: ./.github/workflows/run_tests.yml
        permissions:
            contents: read
            pull-requests: write
        with:
            # The master tip before this push: what is deployed, and what the protos must stay
            # compatible with unless the version is bumped.
            proto_baseline: ${{ github.event.before || inputs.proto_baseline }}

    build-and-deploy:
        needs: tests
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v5
              with:
                  persist-credentials: false
                  # The full history, so the build can name each spec's last change (tools/vite/build_info.mts).
                  # git log over paths reads commits and trees only, so the file contents stay out of it.
                  fetch-depth: 0
                  filter: blob:none

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: ./.github/actions/setup-protoc

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            # The deploy action copies the build with rsync.
            - name: Install binaryen and rsync
              run: sudo apt-get update && sudo apt-get install -y binaryen rsync

            - name: Build 🔧
              run: |
                  make dist/forever/.dirstamp

            - name: Update proto version file
              run: |
                  cp sim/core/TestProtoVersioning.results .deployedprotoversion

            - name: Commit updated version file
              run: |
                  git config --local user.name "github-actions[bot]"
                  git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if ! git diff --exit-code -- .deployedprotoversion; then
                      git checkout -b github-actions
                      git add .deployedprotoversion
                      git commit -m "Auto-update .deployedprotoversion file due to API version increase"
                      git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
                      git push --set-upstream origin github-actions
                      gh pr create --fill
                      gh pr merge --merge --delete-branch
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  repository-name: wowsims/pages-deploy
                  branch: main
                  folder: dist/forever
                  target-folder: forever
                  single-commit: true
                  token: ${{ secrets.DEPLOY_REPO_TOKEN }}
