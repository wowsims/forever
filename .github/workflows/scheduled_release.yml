name: Scheduled Release

on:
    workflow_dispatch:
    schedule:
        # Every 2 hours on the hour; a run with no new commit on master releases nothing.
        - cron: '0 */2 * * *'

permissions: {}

jobs:
    schedule:
        # Reads the tags and starts the Release workflow, which runs with its own permissions.
        permissions:
            actions: write
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: 'Get Previous tag'
              id: previoustag
              uses: WyriHaximus/github-action-get-previous-tag@04e8485ecb6487243907e330d522ff60f02283ce # v1.4.0

            - name: 'Get Commit Hashes'
              id: getcommithashes
              env:
                  PREVIOUS_TAG: ${{ steps.previoustag.outputs.tag }}
              run: |
                  git rev-parse HEAD
                  git rev-parse "$PREVIOUS_TAG"
                  echo "current=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
                  echo "last=$(git rev-parse "$PREVIOUS_TAG")" >> $GITHUB_OUTPUT

            - name: 'Get next version'
              if: steps.getcommithashes.outputs.current != steps.getcommithashes.outputs.last
              id: semvers
              uses: WyriHaximus/github-action-next-semvers@18aa9ed4152808ab99b88d71f5481e41f8d89930 # v1.2.1
              with:
                  version: ${{ steps.previoustag.outputs.tag }}

            - name: Trigger Release
              if: steps.getcommithashes.outputs.current != steps.getcommithashes.outputs.last
              uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
              with:
                  workflow: Release
                  inputs: '{ "ref": "master", "tag": "${{ steps.semvers.outputs.v_patch }}" }'
