name: Update DB

# Regenerates everything derived from the game files without a WoW install:
# db2tool reads the current wowf build off Blizzard's CDN, overlays
# the latest hotfix cache (raidbots' mirror of the game files' DBCache.bin), and
# every generator runs as it would after a local `make db` — the database
# assets, the .proto talent enums, the auto-generated Go and TypeScript, the
# spell data tables and the base stats. Whatever changed lands in a pull
# request; nothing changed means no pull request.
on:
    workflow_dispatch:
    # To also refresh the hotfixes on a schedule:
    # schedule:
    #     - cron: '0 6 * * *'

env:
    PRODUCT: wowf
    # Raidbots' Forever cache (docs/spell_data/partial-updates.md).
    DBCACHE_URL: https://storage.googleapis.com/raidbots-static/wow/classic_beta/enUS/DBCache.bin

jobs:
    update-db:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: write
            pull-requests: write
        outputs:
            pull-request-operation: ${{ steps.pr.outputs.pull-request-operation }}
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v5

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: ./.github/actions/setup-protoc

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            # The version service names the build the CDN currently serves. Its
            # build config hash keys the download cache below, so a re-run for
            # the same build (new hotfixes only) fetches nothing from the CDN.
            - name: Resolve the current build 🔎
              id: build
              run: |
                  row=$(curl -fsS "https://us.version.battle.net/$PRODUCT/versions" | awk -F'|' '$1 == "us"')
                  config=$(echo "$row" | cut -d'|' -f2)
                  version=$(echo "$row" | cut -d'|' -f6)
                  test -n "$config" && test -n "$version"
                  echo "Current $PRODUCT build: $version (build config $config)"
                  echo "config=$config" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Cache CDN downloads and definitions 📦
              uses: actions/cache@v5
              with:
                  path: |
                      tools/db2tool/cdncache
                      tools/db2tool/DBDCache
                      tools/db2tool/listfile.csv
                      tools/db2tool/TACTKeys.txt
                  key: db2tool-${{ env.PRODUCT }}-${{ steps.build.outputs.config }}

            - name: Download the latest hotfix cache ⚡
              run: |
                  mkdir -p tools/db2tool/caches
                  curl -fsSL -o tools/db2tool/caches/DBCache.bin "$DBCACHE_URL"

            # gen_db imports the Go protos, so they are generated from the
            # committed .proto files first; `make proto` runs again further
            # down, once gen_db has rewritten the talent enums in them.
            - name: Bootstrap the Go protos and the dist stub 🧬
              run: make sim/core/proto/api.pb.go binary_dist/dist.go

            # --carry-hotfixes carries an older build's cache onto the CDN
            # build (docs/spell_data/partial-updates.md). db2tool's Hotfixes
            # line, which names any carried build, and the spell data change
            # report go into the pull request body.
            - name: Extract game files data and regenerate the database 🔧
              id: db
              run: |
                  set -o pipefail
                  make db DB2TOOL_FLAGS="--cdn --dbcache tools/db2tool/caches/DBCache.bin --carry-hotfixes" 2>&1 | tee "$RUNNER_TEMP/db.log"
                  line=$(grep -m1 '^Hotfixes: ' "$RUNNER_TEMP/db.log")
                  case "$line" in
                      "Hotfixes: none applied"*) echo "hotfixes=${line#Hotfixes: }" >> "$GITHUB_OUTPUT" ;;
                      *) echo "hotfixes=applied (${line#Hotfixes: })" >> "$GITHUB_OUTPUT" ;;
                  esac
                  {
                      echo "report<<REPORT_EOF"
                      python3 tools/spelldata_report_markdown.py < "$RUNNER_TEMP/db.log" || echo "The spell data change report could not be formatted; the build log has it."
                      echo "REPORT_EOF"
                  } >> "$GITHUB_OUTPUT"

            # In dependency order: the base stats and spell tables read
            # wowsims.db; the protos pick up the rewritten .proto files; the TS
            # constants are derived from the regenerated Go, so they go last and
            # call gen_db directly (on a fresh checkout `make go-to-ts` would
            # consider its outputs up to date).
            - name: Regenerate the derived Go, protos and TypeScript 📐
              run: |
                  make basestats
                  go run ./tools/database/gen_spelldata
                  make proto
                  go run ./tools/database/gen_db -gen=go-to-ts

            - name: Check the regenerated code builds 🧪
              run: |
                  go build ./...
                  go test ./tools/database/
                  npm run type-check

            # A new build often moves .results numbers, and the pull request is where they are reviewed,
            # so a failing test still opens it: the summary goes into its body and the job fails after.
            - name: Run the Go tests 🧪
              id: tests
              continue-on-error: true
              env:
                  GOARCH: amd64
              run: |
                  set -o pipefail
                  status=0
                  go list ./sim/... | xargs -r go test --tags=with_db 2>&1 | tee "$RUNNER_TEMP/test.log" || status=1
                  {
                      echo "summary<<TESTS_EOF"
                      if [ "$status" -eq 0 ]; then
                          echo "All Go tests pass (\`go test --tags=with_db ./sim/...\`)."
                      else
                          echo "Go tests fail (\`go test --tags=with_db ./sim/...\`):"
                          echo
                          echo '```'
                          grep -E '^(--- FAIL|FAIL|panic:)' "$RUNNER_TEMP/test.log" | head -n 100 || true
                          echo '```'
                      fi
                      echo "TESTS_EOF"
                  } >> "$GITHUB_OUTPUT"
                  exit "$status"

            # Runs even when a step above failed, so the build log always ends with
            # what the run changed; a failed run opens no pull request to show it.
            - name: List what changed 📋
              if: always()
              run: |
                  git status --short
                  git diff --stat

            - name: Set date
              id: date
              run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

            - name: Create Pull Request 🚀
              id: pr
              uses: peter-evans/create-pull-request@v8
              with:
                  branch: update_db
                  delete-branch: true
                  commit-message: '[DB] Update to ${{ steps.build.outputs.version }} with hotfixes as of ${{ steps.date.outputs.date }}'
                  title: '[DB] Update to ${{ steps.build.outputs.version }} with hotfixes as of ${{ steps.date.outputs.date }}'
                  body: |
                      Game files data and everything generated from it, regenerated from the `${{ env.PRODUCT }}` build on Blizzard's CDN.

                      - Build: ${{ steps.build.outputs.version }}
                      - Hotfixes: ${{ steps.db.outputs.hotfixes }} (from ${{ env.DBCACHE_URL }})
                      - Ran `make db --cdn`, `make basestats`, `gen_spelldata`, `make proto` and `go-to-ts`; the Go builds, the generator tests pass and the UI type-checks

                      ${{ steps.tests.outputs.summary }}

                      ${{ steps.db.outputs.report }}

            - name: Fail on the Go tests
              if: steps.tests.outcome == 'failure'
              run: |
                  echo "::error::Go tests fail; the pull request lists them"
                  exit 1

    # The pull request checks do not run for a pull request the workflow token
    # opened, so run the same test suite against the branch here.
    #test:
    #    needs: update-db
    #    if: needs.update-db.outputs.pull-request-operation == 'created' || needs.update-db.outputs.pull-request-operation == 'updated'
    #    uses: ./.github/workflows/run_tests.yml
