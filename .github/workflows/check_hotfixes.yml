name: Check Hotfixes

# Hotfixes reach only a logged-in game, so the one feed of them is raidbots' collection of the game's
# DBCache.bin. Every hour this reads raidbots' list of collected files and dispatches Update Items with
# the newest `forever` file for the CDN build or an older one when it has not been seen before; Update
# Items carries an older build's file onto the CDN build (see docs/spell_data/partial-updates.md).
# Each upload has a URL of its own, so the file Update Items downloads is the one checked here.
on:
    workflow_dispatch:
    schedule:
        - cron: '17 * * * *'

env:
    PRODUCT: wowf
    DBCACHE_LIST_URL: https://www.raidbots.com/api/dbcache/verified

jobs:
    check-hotfixes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            # The list holds the newest 100 files across every game version raidbots collects.
            - name: Read the newest hotfix cache and the current build 🔎
              id: probe
              run: |
                  set -o pipefail
                  cdn_build=$(curl -fsS "https://us.version.battle.net/$PRODUCT/versions" | awk -F'|' '$1 == "us" { print $5 }')
                  test -n "$cdn_build"
                  newest=$(curl -fsS "$DBCACHE_LIST_URL" | BUILD="$cdn_build" python3 -c '
                  import json, os, sys
                  rows = [r for r in json.load(sys.stdin)["data"] if r["version"] == "forever" and r["build"] <= int(os.environ["BUILD"])]
                  if rows:
                      r = max(rows, key=lambda r: r["created"])
                      print(r["build"], r["url"])
                  ')
                  read -r cache_build url <<< "$newest"
                  if [ -z "$url" ]; then
                      echo "No forever file for CDN build $cdn_build or an older one among the newest 100"
                      exit 0
                  fi
                  echo "Newest DBCache.bin $url, build $cache_build; CDN build $cdn_build"
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  name=${url##*%2F}
                  echo "key=${name%.bin}" >> "$GITHUB_OUTPUT"

            - name: Look up the hotfix cache 📦
              id: seen
              if: steps.probe.outputs.url != ''
              uses: actions/cache/restore@v5
              with:
                  path: dbcache-url
                  key: ${{ steps.probe.outputs.key }}
                  lookup-only: true

            - name: Dispatch Update Items 🚀
              if: steps.probe.outputs.url != '' && steps.seen.outputs.cache-hit != 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DBCACHE_URL: ${{ steps.probe.outputs.url }}
              run: gh workflow run update_items.yml -R "$GITHUB_REPOSITORY" --ref master -f dbcache_url="$DBCACHE_URL"

            - name: Mark the hotfix cache as seen
              if: steps.probe.outputs.url != '' && steps.seen.outputs.cache-hit != 'true'
              run: echo "${{ steps.probe.outputs.url }}" > dbcache-url

            - name: Remember the hotfix cache 📦
              if: steps.probe.outputs.url != '' && steps.seen.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: dbcache-url
                  key: ${{ steps.probe.outputs.key }}
