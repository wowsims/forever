name: Check Hotfixes

# Hotfixes reach only a logged-in game, so the one feed of them is raidbots' collection of the game's
# DBCache.bin. Every hour this reads raidbots' list of collected files and dispatches Update Items with
# the newest Forever file when it has not been seen before. Each upload has a URL of its own, so the
# file Update Items downloads is the one checked here. Around a build push the newest file can still be
# for the previous build, which db2tool would not apply; nothing is dispatched until it matches the
# build the CDN serves.
on:
    workflow_dispatch:
    schedule:
        - cron: '17 * * * *'

env:
    PRODUCT: wow_classic_beta
    DBCACHE_LIST_URL: https://www.raidbots.com/api/dbcache/verified

jobs:
    check-hotfixes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            # The list holds the newest 100 files across every game version raidbots collects.
            - name: Read the newest hotfix cache and the current beta build 🔎
              id: probe
              run: |
                  set -o pipefail
                  newest=$(curl -fsS "$DBCACHE_LIST_URL" | python3 -c '
                  import json, sys
                  rows = [r for r in json.load(sys.stdin)["data"] if r["version"] == "classic_beta"]
                  if rows:
                      r = max(rows, key=lambda r: r["created"])
                      print(r["build"], r["url"])
                  ')
                  read -r cache_build url <<< "$newest"
                  cdn_build=$(curl -fsS "https://us.version.battle.net/$PRODUCT/versions" | awk -F'|' '$1 == "us" { print $5 }')
                  test -n "$cdn_build"
                  if [ -z "$url" ]; then
                      echo "No classic_beta file among the newest 100"
                      echo "same-build=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  echo "Newest DBCache.bin $url, build $cache_build; CDN build $cdn_build"
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  name=${url##*%2F}
                  echo "key=${name%.bin}" >> "$GITHUB_OUTPUT"
                  echo "same-build=$([ "$cache_build" = "$cdn_build" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - name: Look up the hotfix cache 📦
              id: seen
              if: steps.probe.outputs.same-build == 'true'
              uses: actions/cache/restore@v5
              with:
                  path: dbcache-url
                  key: ${{ steps.probe.outputs.key }}
                  lookup-only: true

            - name: Dispatch Update Items 🚀
              if: steps.probe.outputs.same-build == 'true' && steps.seen.outputs.cache-hit != 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DBCACHE_URL: ${{ steps.probe.outputs.url }}
              run: gh workflow run update_items.yml -R "$GITHUB_REPOSITORY" --ref master -f dbcache_url="$DBCACHE_URL"

            - name: Mark the hotfix cache as seen
              if: steps.probe.outputs.same-build == 'true' && steps.seen.outputs.cache-hit != 'true'
              run: echo "${{ steps.probe.outputs.url }}" > dbcache-url

            - name: Remember the hotfix cache 📦
              if: steps.probe.outputs.same-build == 'true' && steps.seen.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: dbcache-url
                  key: ${{ steps.probe.outputs.key }}
