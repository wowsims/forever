name: Update Items

# Moves the items onto the current game build without a WoW install, and nothing else: db2tool reads
# the current wowf build off Blizzard's CDN and overlays the latest hotfix cache, the same way the
# Update DB workflow does, and --carry-hotfixes carries an older build's cache onto the CDN build
# (see docs/spell_data/partial-updates.md). `make db CLASSES=none SHARED=0` then takes
# only the items spell data group (the item, enchant and set-bonus rows, with the item database gen_db
# writes). Every class, the racials and the shared rows stay on the build the committed inputs record
# (see docs/spell_data/partial-updates.md). Whatever changed lands in a pull request; nothing changed
# means no pull request. Check Hotfixes dispatches this when new hotfixes come out. A pull request with
# hotfixes applied that passes the Go tests here and the Run Tests suite is merged and deployed.
on:
    workflow_dispatch:
        inputs:
            dbcache_url:
                description: 'The DBCache.bin to apply (defaults to the latest raidbots forever file)'
                required: false
                type: string

# A second dispatch waits for the running one, which may still be merging its pull request.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

env:
    PRODUCT: wowf
    DBCACHE_URL: ${{ inputs.dbcache_url || 'https://storage.googleapis.com/raidbots-static/wow/forever/enUS/DBCache.bin' }}

jobs:
    update-items:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: write
            pull-requests: write
        outputs:
            hotfixes-applied: ${{ startsWith(steps.db.outputs.hotfixes, 'applied') }}
            pull-request-number: ${{ steps.pr.outputs.pull-request-number }}
            pull-request-operation: ${{ steps.pr.outputs.pull-request-operation }}
            pull-request-head-sha: ${{ steps.pr.outputs.pull-request-head-sha }}
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v5

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.27.x

            - name: Install Protoc
              uses: ./.github/actions/setup-protoc

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 26
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            # The version service names the build the CDN currently serves. Its build config hash keys
            # the download cache below, so a re-run for the same build fetches nothing from the CDN.
            - name: Resolve the current build 🔎
              id: build
              run: |
                  row=$(curl -fsS "https://us.version.battle.net/$PRODUCT/versions" | awk -F'|' '$1 == "us"')
                  config=$(echo "$row" | cut -d'|' -f2)
                  version=$(echo "$row" | cut -d'|' -f6)
                  test -n "$config" && test -n "$version"
                  echo "Current $PRODUCT build: $version (build config $config)"
                  echo "config=$config" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Cache CDN downloads and definitions 📦
              uses: actions/cache@v5
              with:
                  path: |
                      tools/db2tool/cdncache
                      tools/db2tool/DBDCache
                      tools/db2tool/listfile.csv
                      tools/db2tool/TACTKeys.txt
                  key: db2tool-${{ env.PRODUCT }}-${{ steps.build.outputs.config }}

            - name: Download the latest hotfix cache ⚡
              run: |
                  mkdir -p tools/db2tool/caches
                  curl -fsSL -o tools/db2tool/caches/DBCache.bin "$DBCACHE_URL"
            # gen_db imports the Go protos, so they are generated from the committed .proto files
            # first. Taking no class, gen_db rewrites no .proto file, so they need no second pass.
            # The UI type-check below reads the TS protos and the go-to-ts constants, which are not
            # committed; gen_db is called directly because on a fresh checkout `make go-to-ts`
            # considers its outputs up to date.
            - name: Bootstrap the protos, the TS constants and the dist stub 🧬
              run: |
                  make sim/core/proto/api.pb.go ui/generated/proto/api.ts binary_dist/dist.go
                  go run ./tools/database/gen_db -gen=go-to-ts

            # db2tool's Hotfixes line, which names any carried build, and the spell data change report
            # go into the pull request body.
            - name: Extract game files data and regenerate the items 🔧
              id: db
              run: |
                  set -o pipefail
                  make db CLASSES=none SHARED=0 DB2TOOL_FLAGS="--cdn --dbcache tools/db2tool/caches/DBCache.bin --carry-hotfixes" 2>&1 | tee "$RUNNER_TEMP/db.log"
                  line=$(grep -m1 '^Hotfixes: ' "$RUNNER_TEMP/db.log")
                  case "$line" in
                      "Hotfixes: none applied"*) echo "hotfixes=${line#Hotfixes: }" >> "$GITHUB_OUTPUT" ;;
                      *) echo "hotfixes=applied (${line#Hotfixes: })" >> "$GITHUB_OUTPUT" ;;
                  esac
                  {
                      echo "report<<REPORT_EOF"
                      python3 tools/spelldata_report_markdown.py < "$RUNNER_TEMP/db.log" || echo "The spell data change report could not be formatted; the build log has it."
                      echo "REPORT_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Check the regenerated code builds 🧪
              run: |
                  go build ./...
                  go test ./tools/database/
                  npm run type-check

            # The SIML name table names every item, enchant and suffix of the database and every spell the sim
            # registers, so the pull request carries the names a new row adds (sim/siml/SPEC.md §7.4). Like the
            # tests below, a failure still opens the pull request, with the committed table, and fails the job after.
            - name: Regenerate the SIML name table
              id: names
              continue-on-error: true
              run: go run --tags=with_db ./sim/siml/cmd/simlnames -w

            # New item rows can move .results numbers, and the pull request is where they are reviewed,
            # so a failing test still opens it: the summary goes into its body and the job fails after.
            - name: Run the Go tests 🧪
              id: tests
              continue-on-error: true
              env:
                  GOARCH: amd64
              run: |
                  set -o pipefail
                  status=0
                  go list ./sim/... | xargs -r go test --tags=with_db 2>&1 | tee "$RUNNER_TEMP/test.log" || status=1
                  {
                      echo "summary<<TESTS_EOF"
                      if [ "$status" -eq 0 ]; then
                          echo "All Go tests pass (\`go test --tags=with_db ./sim/...\`)."
                      else
                          echo "Go tests fail (\`go test --tags=with_db ./sim/...\`):"
                          echo
                          echo '```'
                          grep -E '^(--- FAIL|FAIL|panic:)' "$RUNNER_TEMP/test.log" | head -n 100 || true
                          echo '```'
                      fi
                      echo "TESTS_EOF"
                  } >> "$GITHUB_OUTPUT"
                  exit "$status"

            - name: Set date
              id: date
              run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

            - name: Create Pull Request 🚀
              id: pr
              uses: peter-evans/create-pull-request@v8
              with:
                  branch: update_items
                  delete-branch: true
                  commit-message: '[DB] Update items to ${{ steps.build.outputs.version }} with hotfixes as of ${{ steps.date.outputs.date }}'
                  title: '[DB] Update items to ${{ steps.build.outputs.version }} with hotfixes as of ${{ steps.date.outputs.date }}'
                  body: |
                      The items spell data group and the item database, regenerated from the `${{ env.PRODUCT }}` build on Blizzard's CDN. Every class, the racials and the shared rows stay on their committed builds.

                      - Build: ${{ steps.build.outputs.version }}
                      - Hotfixes: ${{ steps.db.outputs.hotfixes }} (from ${{ env.DBCACHE_URL }})
                      - Ran `make db CLASSES=none SHARED=0 --cdn` and `simlnames`; the Go builds, the generator tests pass and the UI type-checks

                      ${{ steps.tests.outputs.summary }}

                      ${{ steps.db.outputs.report }}

            - name: Fail on the SIML name table
              if: steps.names.outcome == 'failure'
              run: |
                  echo "::error::simlnames fails; the pull request carries the committed name table"
                  exit 1

            - name: Fail on the Go tests
              if: steps.tests.outcome == 'failure'
              run: |
                  echo "::error::Go tests fail; the pull request lists them"
                  exit 1

    # The pull request checks do not run for a pull request the workflow token opened, so the same
    # suite runs against the branch here.
    test:
        needs: update-items
        if: needs.update-items.outputs.pull-request-operation == 'created' || needs.update-items.outputs.pull-request-operation == 'updated'
        uses: ./.github/workflows/run_tests.yml
        permissions:
            contents: read
            pull-requests: write
        with:
            ref: ${{ needs.update-items.outputs.pull-request-head-sha }}

    # Without hotfixes the items fall back to the raw build, so such a pull request waits for review.
    # A merge by the workflow token starts no push workflow, so the deploy is dispatched while Build
    # and Deploy is enabled.
    merge:
        needs: [update-items, test]
        if: needs.update-items.outputs.hotfixes-applied == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
            contents: write
            pull-requests: write
        steps:
            - name: Merge the pull request 🔀
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  before=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
                  gh pr merge "${{ needs.update-items.outputs.pull-request-number }}" -R "$GITHUB_REPOSITORY" \
                      --merge --delete-branch --match-head-commit "${{ needs.update-items.outputs.pull-request-head-sha }}"
                  if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml" --jq .state)" = active ]; then
                      gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref master -f proto_baseline="$before"
                  else
                      echo "Build and Deploy is disabled; nothing deployed"
                  fi
