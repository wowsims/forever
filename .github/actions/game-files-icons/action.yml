name: Game files icons
description: Decodes the icons the database names from the game files into assets/icons (tools/icons), or restores them from the Actions cache when an earlier run decoded the same build, database and decoder.
runs:
    using: composite
    steps:
        # The version service names the build the CDN serves.
        - name: Resolve the current build
          id: build
          shell: bash
          run: |
              config=$(curl -fsS --retry 3 "https://us.version.battle.net/wowf/versions" | awk -F'|' '$1 == "us"' | cut -d'|' -f2)
              test -n "$config"
              echo "config=$config" >> "$GITHUB_OUTPUT"

        - name: Restore the icons
          id: restore
          uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
          with:
              path: assets/icons
              key: icons-wowf-${{ steps.build.outputs.config }}-${{ hashFiles('assets/database/db.bin', 'assets/database/leftover_db.bin', 'assets/database/tooltips.json', 'tools/icons/**', 'tools/db2tool/tact/**') }}

        - name: Decode the icons
          if: steps.restore.outputs.cache-hit != 'true'
          shell: bash
          run: make icons

        # A failed decode stops the action before this step, so the cache only ever holds a complete set.
        - name: Save the icons
          if: steps.restore.outputs.cache-hit != 'true'
          uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
          with:
              path: assets/icons
              key: ${{ steps.restore.outputs.cache-primary-key }}
